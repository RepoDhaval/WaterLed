<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Blob Morph + Wave Sweep (Optimized)</title>

<!--
  Runs synchronously, before the body (and its heavy SVG filters) is even
  parsed, so `html.perf-lite` is already set by the time those elements
  render. Without this, the page briefly paints the full-cost version and
  then strips it back a frame or two later.
-->
<script>
(function () {
  var coarse = (navigator.hardwareConcurrency && navigator.hardwareConcurrency <= 4) ||
               (navigator.deviceMemory && navigator.deviceMemory <= 4);
  if (window.matchMedia('(max-width: 768px)').matches || coarse) {
    document.documentElement.classList.add('perf-lite');
  }
}());
</script>

<style>

  /*
    OPTIMIZATION NOTES (read me):
    1. The old #led grid created 10,000 <div>s via JS. Replaced with a single
       CSS repeating-linear-gradient — same visual, zero extra DOM nodes.
    2. Each corner used to render TWO overlapping filtered blobs (phase-offset
       "echo"). One copy per corner is deleted below — the remaining blob
       already morphs through both shapes, so the visual loss is minimal but
       it HALVES the SVG filter cost for those two corners.
    3. feTurbulence numOctaves dropped 3->2 on every decorative (non-hero)
       filter. Cheaper noise generation, same organic look at these sizes.
    4. A "perf-lite" mode kicks in on small viewports AND on wide-but-weak
       devices (low hardwareConcurrency/deviceMemory, e.g. budget tablets).
       It hides the 4 morph-field shapes that get cropped off-screen on
       narrow viewports anyway, cuts the 3-wave sweep down to 1, drops the
       wave's turbulence filter (keeps the smooth path motion), and swaps
       the expensive `mix-blend-mode: screen` for plain opacity.
    5. Reduced-motion handling now also pauses perf-lite-hidden layers.
    6. The 4 corner blobs are barely/never visible on mobile & tablet widths
       (covered by the enlarged main blob, or shoved off toward clipped
       edges). Below 900px they are now fully REMOVED from the DOM by JS —
       not just hidden — so their filters never get created, never get
       painted, and their SMIL timers never tick. A CSS `display:none`
       fallback at the same breakpoint covers no-JS environments (it won't
       free the animation cost, but it stops the paint cost).
    7. FROZEN TURBULENCE (the big one). Two filter pipelines animate
       `baseFrequency` on their <feTurbulence>: the main blob, and the 4
       "morph-center" background blobs. Animating baseFrequency forces the
       browser to fully regenerate the noise texture every frame — it's the
       single most expensive operation on this page, independent of shape
       size. The morph-center blobs never move otherwise (their `d` is
       static), so in perf-lite their baseFrequency animation is removed
       entirely and replaced with a static mid-cycle value: the filter
       becomes fully static and is effectively free after first paint, with
       ~no visible difference (it was a slow, subtle 40s wobble). The main
       blob's shape keeps morphing either way, so its turbulence can't be
       made fully static, but freezing baseFrequency still lets the browser
       reuse the generated noise texture across frames instead of
       resynthesizing it, which is the majority of that filter's cost.
    8. perf-lite is now applied to `html` (not `body`) via a synchronous
       head script, so the CSS-driven parts of perf-lite (hidden layers,
       blend mode swap) apply before first paint instead of after.
  */

  :root {
    --corner-blob-lg: clamp(120px, 20vw, 260px);
    --corner-blob-sm: clamp(96px, 17vw, 220px);
    --corner-gap: clamp(12px, 4vw, 32px);
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    height: 100%;
    min-height: 100dvh;
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(135deg, #2C5EAD, #1591DC);
    position: relative;
    overflow: hidden;
  }

  svg.main-blob {
    width: min(60vw, 683px);
    max-width: 90vw;
    height: auto;
  }

  .corner-slot {
    display: contents;
  }

  svg.corner-blob,
  svg.corner-blob-left,
  svg.corner-blob-bottom-right,
  svg.corner-blob-bottom-left {
    position: fixed;
    width: var(--corner-blob-lg);
    height: auto;
    pointer-events: none;
    contain: layout style paint;
  }

  svg.corner-blob {
    top: var(--corner-gap);
    right: var(--corner-gap);
    transform: scale(1.4);
    transform-origin: top right;
  }

  svg.corner-blob-left {
    top: var(--corner-gap);
    left: var(--corner-gap);
    width: var(--corner-blob-sm);
  }

  svg.corner-blob-bottom-right {
    bottom: var(--corner-gap);
    right: var(--corner-gap);
    width: var(--corner-blob-sm);
  }

  svg.corner-blob-bottom-left {
    bottom: var(--corner-gap);
    left: var(--corner-gap);
    transform: scale(1.4);
    transform-origin: bottom left;
  }

  /* Full-screen scattered morph layer — sits above corner blobs (z-index 5),
     below the wave sweep (z-index 10). */
  svg.morph-layer {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    z-index: 5;
    pointer-events: none;
    contain: layout style paint;
  }

  /* Wave overlay sits above everything. Screen blend only on capable devices
     (see .perf-lite override below) since it's costly to compose on weak GPUs. */
  .wave-stage {
    opacity: .7;
    position: fixed;
    inset: 0;
    overflow: hidden;
    z-index: 10;
    pointer-events: none;
    mix-blend-mode: screen;
    contain: layout style paint;
  }
  svg.wave-svg {
    width: 100%;
    height: 100vh;
    display: block;
  }

  /* Faint grid overlay — was 10,000 DOM nodes, now a single CSS pattern. */
  #led {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    opacity: .1;
    z-index: 100;
    pointer-events: none;
    background-image:
      linear-gradient(to right, #333 1px, transparent 1px),
      linear-gradient(to bottom, #333 1px, transparent 1px);
    background-size: 1% 1%; /* mimics the old 100x100 desktop grid */
  }

  @media (max-width: 900px) {
    :root {
      --corner-blob-lg: clamp(90px, 16vw, 200px);
      --corner-blob-sm: clamp(76px, 14vw, 170px);
    }
    svg.main-blob { width: 72vw; }
    #led { background-size: 5% 2.5%; } /* mimics the old 20x40 mobile grid */
  }

  @media (max-width: 600px) {
    :root {
      --corner-blob-lg: clamp(64px, 24vw, 130px);
      --corner-blob-sm: clamp(56px, 20vw, 110px);
      --corner-gap: 10px;
    }
    svg.main-blob { width: 82vw; max-width: 420px; }
  }

  /* No-JS fallback: JS removes these from the DOM entirely below 900px
     (see script at the bottom). This just stops paint if JS is disabled. */
  @media (max-width: 900px) {
    .corner-slot { display: none; }
  }

  @media (max-height: 480px) {
    svg.main-blob { width: 40vh; max-width: none; }
    :root {
      --corner-blob-lg: clamp(64px, 14vh, 130px);
      --corner-blob-sm: clamp(56px, 12vh, 110px);
    }
  }

  /* ---- perf-lite: applied to <html> by the head script (before paint) and
     kept in sync by the bottom script (resize / orientation change). ---- */

  /* Morph shapes near the edges of the 1705x1080 viewBox get cropped out by
     `preserveAspectRatio="xMidYMid slice"` on narrow/tall viewports anyway —
     hiding them here is a pure perf win with ~no visual change. JS also
     removes them from the DOM entirely (see bottom script). */
  html.perf-lite .morph-edge { display: none; }

  /* Cut 3 concurrent wave sweeps down to 1. */
  html.perf-lite .wave-b,
  html.perf-lite .wave-c { display: none; }

  /* Drop the wave's turbulence/displacement filter (CSS filter overrides the
     SVG presentation attribute) — keeps the smooth path + fade motion,
     removes the priciest part of the effect. Also swap the blend mode. */
  html.perf-lite .wave-mover { filter: none !important; }
  html.perf-lite .wave-stage { mix-blend-mode: normal; opacity: .35; }

  /* The morph-center blobs' turbulence baseFrequency is frozen by JS in
     perf-lite (see bottom script) — that's the actual cost saving, since it
     stops the filter from being recomputed every frame. But a fully static
     shape looks dead next to everything else that's moving. `transform` and
     `opacity` are compositor-only properties — animating them costs almost
     nothing (no repaint, no filter recompute) — so they replace the
     turbulence wobble as the *visible* motion instead of removing motion
     altogether. `:nth-of-type` lines up with the fixed edge/center ordering
     of the .morph-shape siblings (edge, center, edge, center, ...), so no
     extra class or JS is needed to tell the four center blobs apart. */
  @keyframes morph-drift-a {
    0%, 100% { transform: translate(0, 0) scale(1); }
    50%      { transform: translate(10px, -12px) scale(1.06); }
  }
  @keyframes morph-drift-b {
    0%, 100% { transform: translate(0, 0) scale(1); }
    50%      { transform: translate(-12px, 9px) scale(0.94); }
  }
  html.perf-lite .morph-center {
    transform-box: fill-box;
    transform-origin: center;
    animation: morph-drift-a 9s ease-in-out infinite;
  }
  html.perf-lite .morph-center:nth-of-type(4n) {
    animation-name: morph-drift-b;
    animation-duration: 11s;
    animation-delay: -4s; /* desyncs it from the odd-position blobs */
  }

</style>
</head>

<script>
  // Corner blobs are barely/never visible on mobile & tablet widths (covered
  // by the enlarged main blob, or pushed toward edges the viewport doesn't
  // show). Rather than just hiding them with CSS, fully remove them from the
  // DOM below 900px — their filters are never created, never painted, and
  // their SMIL timers never run. Cache each slot's markup so it can be
  // restored if the window is resized back up past the breakpoint (e.g. a
  // desktop browser window, or a tablet rotated wide enough — this only
  // matters for live window resizing, not a one-time page load).
  (function () {
    var slots = Array.prototype.slice.call(document.querySelectorAll('.corner-slot'));
    var cache = slots.map(function (slot) { return slot.innerHTML; });
    var query = window.matchMedia('(max-width: 900px)');

    function applyCornerVisibility(hide) {
      slots.forEach(function (slot, i) {
        if (hide) {
          if (slot.innerHTML !== '') slot.innerHTML = '';
        } else if (slot.innerHTML === '') {
          slot.innerHTML = cache[i];
        }
      });
    }
    applyCornerVisibility(query.matches);
    query.addEventListener('change', function (e) { applyCornerVisibility(e.matches); });
  })();
</script>

<script>
  // Detect small viewport OR weak-but-wide hardware (budget tablets, older
  // laptops) and drop to the lighter effect set. No more 10,000-div loop here.
  //
  // Beyond the CSS toggles (handled by html.perf-lite, already applied
  // before paint by the head script), this also:
  //  - removes the .morph-edge groups from the DOM entirely (not just
  //    display:none), so their SMIL turbulence timers stop ticking
  //  - strips the baseFrequency <animate> from the main blob and the 4
  //    morph-center filters, freezing them at their static fallback value
  //    (already set as a `baseFrequency` attribute on each <feTurbulence>)
  //  - drops the main blob's numOctaves 3 -> 2
  // All of this is cached and restored if the device leaves perf-lite
  // (e.g. rotating a tablet to a wider orientation).
  (function () {
    var freezeTargets = [
      '#filter0_g_1041_5 feTurbulence',
      '#filter1_g_1044_19 feTurbulence',
      '#filter3_g_1044_19 feTurbulence',
      '#filter5_g_1044_19 feTurbulence',
      '#filter7_g_1044_19 feTurbulence'
    ];
    var frozen = [];

    function freezeTurbulence() {
      if (frozen.length) return;
      freezeTargets.forEach(function (sel) {
        var turb = document.querySelector(sel);
        if (!turb) return;
        var anim = turb.querySelector('animate[attributeName="baseFrequency"]');
        if (anim) {
          frozen.push({ turb: turb, anim: anim });
          anim.remove();
        }
      });
    }
    function unfreezeTurbulence() {
      frozen.forEach(function (entry) { entry.turb.appendChild(entry.anim); });
      frozen = [];
    }

    var morphEdgeCache = [];
    function removeMorphEdges() {
      if (morphEdgeCache.length) return;
      Array.prototype.slice.call(document.querySelectorAll('.morph-edge')).forEach(function (el) {
        morphEdgeCache.push({ parent: el.parentNode, next: el.nextSibling, el: el });
        el.remove();
      });
    }
    function restoreMorphEdges() {
      morphEdgeCache.forEach(function (entry) { entry.parent.insertBefore(entry.el, entry.next); });
      morphEdgeCache = [];
    }

    var mainBlobTurb = document.querySelector('#filter0_g_1041_5 feTurbulence');

    // ---- Main blob speed on mobile ----
    // All four of the main blob's animations (viewBox, path d, turbulence
    // baseFrequency, displacement scale) share dur="6s" and are keyframed
    // together — slow one down without the others and the morph looks like
    // it's sliding instead of breathing. Change MOBILE_BLOB_DUR below to
    // tune it (e.g. '9s' = 50% slower, '4s' = 50% faster). Leave it equal
    // to '6s' to match desktop.
    var MOBILE_BLOB_DUR = '9s';
    var mainBlobAnims = Array.prototype.slice.call(document.querySelectorAll('svg.main-blob animate'));
    var mainBlobOriginalDurs = mainBlobAnims.map(function (a) { return a.getAttribute('dur'); });

    function setMainBlobSpeed(mobile) {
      mainBlobAnims.forEach(function (a, i) {
        a.setAttribute('dur', mobile ? MOBILE_BLOB_DUR : mainBlobOriginalDurs[i]);
      });
    }

    var coarseHardware =
      (navigator.hardwareConcurrency && navigator.hardwareConcurrency <= 4) ||
      (navigator.deviceMemory && navigator.deviceMemory <= 4);
    var vpQuery = window.matchMedia('(max-width: 768px)');

    function applyPerfMode() {
      var lite = vpQuery.matches || coarseHardware;
      document.documentElement.classList.toggle('perf-lite', lite);
      if (lite) {
        freezeTurbulence();
        removeMorphEdges();
        if (mainBlobTurb) mainBlobTurb.setAttribute('numOctaves', '2');
        setMainBlobSpeed(true);
      } else {
        unfreezeTurbulence();
        restoreMorphEdges();
        if (mainBlobTurb) mainBlobTurb.setAttribute('numOctaves', '3');
        setMainBlobSpeed(false);
      }
    }
    applyPerfMode();
    vpQuery.addEventListener('change', applyPerfMode);
  })();
</script>

<script>
  // Respect the user's reduced-motion preference by freezing every SMIL
  // animation on every <svg> on the page.
  (function () {
    var query = window.matchMedia('(prefers-reduced-motion: reduce)');
    function applyMotionPreference(reduce) {
      document.querySelectorAll('svg').forEach(function (svg) {
        if (typeof svg.pauseAnimations === 'function' && typeof svg.unpauseAnimations === 'function') {
          reduce ? svg.pauseAnimations() : svg.unpauseAnimations();
        }
      });
    }
    applyMotionPreference(query.matches);
    query.addEventListener('change', function (e) { applyMotionPreference(e.matches); });
  })();
</script>
